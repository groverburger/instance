[package]
name = "instance-audio"
edition.workspace = true
license.workspace = true
version.workspace = true

# The sound engine of the runner (specs/sound.md), also used by the IDE to preview
# sounds: PCM playback with effects, MIDI sequencing and synthesis.

[dependencies]
instance-brand = { path = "../instance-brand" }
midly = "0.5.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rustysynth = "1.3.7"
web-time = "1.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media", "Win32_Foundation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["console"] }
