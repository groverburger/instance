[package]
name = "gm-runner"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
fontdue = "0.9.4"
gilrs = "0.11.2"
gm-format = { path = "../gm-format" }
gml = { path = "../gml" }
midly = "0.5.3"
png = "0.18.1"
rfd = "0.17.2"
rodio = "0.22.2"
rustysynth = "1.3.7"
softbuffer = "0.4.8"
ttf-parser = "0.25.1"
winit = "0.30.13"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media", "Win32_Foundation"] }
