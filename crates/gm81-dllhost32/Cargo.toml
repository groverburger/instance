[package]
name = "gm81-dllhost32"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "32-bit helper process that loads x86 GameMaker DLLs for the 64-bit runner (build with --target i686-pc-windows-msvc)"

[dependencies]
gm-dllcall = { path = "../gm-dllcall" }
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
