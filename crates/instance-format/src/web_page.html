<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:,">
<!-- A game exported by Instance (a GameMaker 8.1 compatible engine): the web runner,
     the game and its data, all in this one file. -->
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; color: #c0c0c0;
    font: 13px/1.4 "Segoe UI", Tahoma, system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #game { display: block; outline: none; image-rendering: pixelated; background: #000; }
  /* the start screen: the game's name, then a classic Play button (the same look as
     Instance's web player, web/play.html) */
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 16px; background: #000; text-align: center; }
  #overlay p { margin: 0; }
  #overlay h1 { margin: 0 0 18px; max-width: 100%; overflow-wrap: anywhere; color: #fff;
    font: 700 22px/1.25 "Segoe UI", Tahoma, system-ui, sans-serif; }
  .play { display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; min-width: 112px;
    padding: 5px 22px; justify-content: center; background: #f0f0f0; color: #0a0a0a; cursor: pointer;
    font: 700 14px/1.2 "Segoe UI", Tahoma, system-ui, sans-serif;
    border: 1px solid; border-color: #fff #696969 #696969 #fff; box-shadow: inset -1px -1px #a0a0a0; }
  .play svg { width: 10px; height: 12px; fill: currentColor; }
  .play:active { border-color: #696969 #fff #fff #696969; box-shadow: inset 1px 1px #a0a0a0; }
  .play:active svg { transform: translate(1px, 1px); }
  .play:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  #status { min-height: 1.4em; margin-top: 12px; max-width: 36em; overflow-wrap: anywhere; }
  .error { color: #ff8080; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480" hidden></canvas>
<div id="overlay">
  <h1>{{TITLE}}</h1>
  <button class="play" id="start" hidden><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0 10 6 0 12z"/></svg>Play</button>
  <p id="status" role="status">Loading&hellip;</p>
  <noscript>This game needs JavaScript.</noscript>
</div>
<script type="module">
// ---- the Instance web runner (wasm-bindgen glue) ----
{{GLUE}}
// ---- start-up ----
{
  // gzip-compressed, base64-encoded payloads
  const RUNNER = "{{WASM}}";
  const GAME = "{{GAME}}";
  const SOUNDFONT = {{SOUNDFONT}};

  const $ = (id) => document.getElementById(id);
  const showStatus = (t, err) => { $("status").textContent = t; $("status").className = err ? "error" : ""; };

  async function unpack(b64) {
    const s = atob(b64);
    const raw = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) raw[i] = s.charCodeAt(i);
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  (async () => {
    try {
      await __wbg_init({ module_or_path: await unpack(RUNNER) });
      if (SOUNDFONT) set_soundfont(await unpack(SOUNDFONT));
      const game = await unpack(GAME);
      showStatus("");
      const btn = $("start");
      btn.hidden = false;
      btn.focus();
      // audio may only start after a user gesture: the game starts from this click
      btn.onclick = () => {
        $("overlay").hidden = true;
        const canvas = $("game");
        canvas.hidden = false;
        try {
          start_game("game", game, undefined);
          canvas.focus();
        } catch (e) {
          console.error(e);
          $("overlay").hidden = false;
          btn.hidden = true;
          showStatus("The game could not start: " + e, true);
        }
      };
      // ?autostart skips the button (the game may then have no sound until a click)
      if (new URLSearchParams(location.search).has("autostart")) btn.onclick();
    } catch (e) {
      console.error(e);
      showStatus("The game could not load: " + (e.message ?? e), true);
    }
  })();

  window.instanceGameEnded = () => {
    $("game").hidden = true;
    $("overlay").hidden = false;
    $("start").hidden = true;
    showStatus("The game has ended.");
  };
}
</script>
</body>
</html>
