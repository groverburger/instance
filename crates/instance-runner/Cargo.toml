[package]
name = "instance-runner"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
fontdue = "0.9.4"
glow = "0.17"
instance-dllcall = { path = "../instance-dllcall" }
gilrs = "0.11.2"
instance-brand = { path = "../instance-brand" }
instance-format = { path = "../instance-format" }
instance-net = { path = "../instance-net" }
gml = { path = "../gml" }
midly = "0.5.3"
png = "0.18.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rustysynth = "1.3.7"
ttf-parser = "0.25.1"
web-time = "1.1"

# Desktop (Windows, macOS, Linux): native window, OpenGL context, dialogs, DLLs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = "0.32"
libloading = "0.8"
raw-window-handle = "0.6"
rfd = "0.17.2"
softbuffer = "0.4.8"
winit = "0.30.13"
# the Debug Information window (--debug)
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard"] }
egui_glow = { version = "0.36.2", default-features = false, features = ["winit"] }
# the shared GameMaker-style look of the IDE (debug window, error dialog)
instance-ui = { path = "../instance-ui" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.36", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

# macOS / Linux: text clipboard for clipboard_* (Windows uses the Win32 API directly).
[target.'cfg(all(not(windows), not(target_arch = "wasm32")))'.dependencies]
arboard = { version = "3.6.1", default-features = false }

# Browser build (see crates/instance-runner/src/web.rs and web/play.html).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
rodio = { version = "0.22.2", default-features = false, features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CanvasRenderingContext2d",
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Performance",
    "Storage",
    "WebGl2RenderingContext",
    "WheelEvent",
    "Window",
    "console",
] }

[build-dependencies]
instance-brand = { path = "../instance-brand" }
