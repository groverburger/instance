[package]
name = "instance-ide"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Clean-room GameMaker 8.1 compatible IDE (egui)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "instance-ide"
path = "src/main.rs"

[dependencies]
fontdue = "0.9.4"
instance-audio = { path = "../instance-audio" }
instance-brand = { path = "../instance-brand" }
instance-format = { path = "../instance-format" }
instance-ui = { path = "../instance-ui" }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "gif", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
rfd = "0.17.2"
# downloads the example games of the welcome dialog
ureq = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Storage", "UrlSearchParams", "console"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

[build-dependencies]
instance-brand = { path = "../instance-brand" }
