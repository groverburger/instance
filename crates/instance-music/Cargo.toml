[package]
name = "instance-music"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Music composition (text notation -> MIDI/WAV) and audio analysis for agents writing GameMaker 8.1 games"

[dependencies]
instance-format = { path = "../instance-format" }
midly = "0.5.3"
rustysynth = "1.3.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }

[dev-dependencies]
# the round-trip test plays our MIDI files through the runner's own sequencer
instance-runner = { path = "../instance-runner" }

[[bin]]
name = "gmk-music"
path = "src/bin/gmk-music.rs"

[[bin]]
name = "gmk-sounds"
path = "src/bin/gmk-sounds.rs"
