# Publishes the web build to GitHub Pages: the site opens the IDE
# (https://groverburger.github.io/instance/), and play.html is the game player.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build the web IDE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (version from Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: SoundFont (MIDI)
        run: bash scripts/fetch-soundfont.sh
      - name: Build the static site
        run: bash scripts/build-web.sh dist/web
      - name: Open the IDE at the site root
        run: |
          mv dist/web/index.html dist/web/about.html
          cp dist/web/ide.html dist/web/index.html
          touch dist/web/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
